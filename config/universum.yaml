# =====================================================================
#  UNIVERSUM -- bolagen som analyseras, grupperade i kategorier
# =====================================================================
#  Portföljen ska hålla ETT bolag per kategori. Alla bolag i en kategori
#  rangordnas bara mot varandra.
#
#  "mattuppsattning" pekar ut vilka nyckeltal kategorin bedöms på.
#  De uppsättningarna definieras i config.yaml.
#
#  Tickern är Yahoo Finance-beteckningen. Svenska aktier slutar på .ST.
#  Är flera aktieslag noterade (A- och B-aktier) ska bara det mest
#  handlade tas med -- annars konkurrerar bolaget med sig självt.
#
#  VIKTIGT: listan nedan är ett förslag att utgå från. Enstaka tickers
#  kan vara felstavade eller avnoterade. I steg 3 bygger vi
#  datatäckningskontrollen, som testar varenda ticker mot Yahoo och
#  talar om exakt vilka som inte svarar. Då rättar vi listan mot facit
#  i stället för mot gissningar. Bolag under gränserna för börsvärde
#  eller omsättning sorteras bort automatiskt -- de kan stå kvar här.
#
#  Lägga till ett bolag: skriv en ny rad med "- TICKER.ST" under rätt
#  kategori. Ta bort: radera raden (eller sätt # först för att
#  tillfälligt stänga av den).
# =====================================================================

