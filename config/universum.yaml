  # ------------------------------------------------------------------
  # INVESTMENTBOLAG -- avstängd kategori (2026-11-13)
  #
  # Borttagen på egen begäran. Substansvärden går inte att hämta
  # automatiskt och inte heller att härleda: Investor och
  # Industrivärden redovisar innehav till marknadsvärde, så deras egna
  # kapital ÄR substansvärdet, medan Latour redovisar industrirörelsen
  # till bokfört värde och har ett eget kapital på en bråkdel av
  # substansvärdet. Se avsnittet om härledda mått i README.
  #
  # Vill du ha kategorin tillbaka: ta bort # från raderna nedan, lägg
  # tillbaka raden för Investmentbolag i portfolj.yaml, ta bort # från
  # måttuppsättningen investmentbolag i config.yaml, och fyll i
  # substansvärden i data/manuellt/substansvarden.csv.
  # ------------------------------------------------------------------
